<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pylon sspc</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@600;700;800&family=Noto+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="searchbar">
  <div class="wrap">
    <form class="search-row" role="search" onsubmit="return false">
      <label class="search-field" for="q">
        <span class="visually-hidden">Αναζήτηση οδηγιών</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" autocomplete="off" aria-label="Αναζήτηση">
        <button id="clear" type="button" aria-label="Καθαρισμός αναζήτησης" hidden>×</button>
      </label>
      <button type="button" class="theme-btn" id="theme" aria-label="Εναλλαγή φωτεινού / σκοτεινού θέματος">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        <span class="lbl">Θέμα</span>
      </button>
    </form>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</div>

<main class="wrap">
  <div class="empty" id="empty" hidden>
    <strong>Δεν βρέθηκε τίποτα για <span id="empty-q"></span></strong>
    Δοκιμάστε μια πιο γενική λέξη, π.χ. «πελάτης», «είδος» ή «δελτίο».
  </div>
  <div id="manuals"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
